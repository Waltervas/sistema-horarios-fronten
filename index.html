<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9A227;--gold-dark:#8A6D1B;--navy:#0F1B2E;--navy-mid:#1D3854;
  --color-background-primary:#FFFFFF;--color-background-secondary:#F3F4F7;--color-background-tertiary:#F7F8FA;
  --color-border-secondary:#DDE1E6;--color-border-tertiary:#E9EBEF;
  --color-text-primary:#10141C;--color-text-secondary:#66707F;
  --color-background-danger:#FDF0F0;--color-border-danger:#F2B8B5;--color-text-danger:#B3261E;
  --card-bg:var(--color-background-primary);--page-bg:var(--color-background-tertiary);
  --shadow-sm:0 1px 2px rgba(16,20,28,.05);--shadow-md:0 4px 16px rgba(16,20,28,.07)
}
[data-theme="dark"]{
  --gold:#D9AE3E;--gold-dark:#C9A227;--navy:#0A0F1A;--navy-mid:#152238;
  --color-background-primary:#141821;--color-background-secondary:#1B202B;--color-background-tertiary:#0D1016;
  --color-border-secondary:#2C323F;--color-border-tertiary:#242A35;
  --color-text-primary:#EAEBEF;--color-text-secondary:#8B93A3;
  --color-background-danger:#2A1616;--color-border-danger:#5C2C2A;--color-text-danger:#F0918C;
  --card-bg:var(--color-background-primary);--page-bg:var(--color-background-tertiary);
  --shadow-sm:0 1px 2px rgba(0,0,0,.25);--shadow-md:0 4px 20px rgba(0,0,0,.4)
}
html{transition:none}
body,.card,.stat-card,input,select,.modal{transition:background-color .15s,border-color .15s,color .15s}
body{font-family:var(--font-sans,'Inter',sans-serif);background:var(--page-bg);color:var(--color-text-primary);min-height:100vh}
.lw{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
.lc{background:var(--card-bg);border:0.5px solid var(--color-border-tertiary);border-radius:14px;padding:2.5rem;width:100%;max-width:400px;box-shadow:var(--shadow-md)}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:0.5px solid var(--color-border-tertiary)}
.logo-mark{width:42px;height:42px;background:var(--navy);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-mark i{color:var(--gold);font-size:22px}
.logo-text strong{display:block;font-family:'Fraunces',serif;font-size:15px;font-weight:600}
.logo-text span{font-size:11px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.lc h2{font-family:'Fraunces',serif;font-size:20px;font-weight:600;margin-bottom:.25rem}
.lc .sub{font-size:13px;color:var(--color-text-secondary);margin-bottom:1.75rem}
.fld{margin-bottom:1rem}
.fld label{display:block;font-size:11px;font-weight:500;color:var(--color-text-secondary);margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em}
.fld input{width:100%;padding:9px 12px;border:0.5px solid var(--color-border-secondary);border-radius:8px;background:var(--card-bg);color:var(--color-text-primary);font-size:14px}
.fld input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,149,42,.15)}
.btn-login{width:100%;padding:11px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer}
.btn-login:hover{background:var(--navy-mid)}
.err{background:var(--color-background-danger);border:0.5px solid var(--color-border-danger);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--color-text-danger);margin-bottom:1rem;display:flex;align-items:center;gap:6px}
.login-hint{margin-top:1.25rem;padding:.75rem 1rem;background:var(--color-background-secondary);border-radius:8px;font-size:12px;color:var(--color-text-secondary);line-height:1.6}
.login-hint strong{color:var(--color-text-primary);font-weight:500}
.layout{display:flex;min-height:100vh}
.sidebar{width:224px;background:var(--navy);display:flex;flex-direction:column;flex-shrink:0}
.sb-head{padding:1.25rem 1.25rem 1rem;border-bottom:0.5px solid rgba(255,255,255,.08)}
.sb-logo{display:flex;align-items:center;gap:10px}
.sb-lm{width:30px;height:30px;background:rgba(184,149,42,.15);border:0.5px solid rgba(184,149,42,.3);border-radius:6px;display:flex;align-items:center;justify-content:center}
.sb-lm i{color:var(--gold);font-size:16px}
.sb-lt{display:flex;flex-direction:column}
.sb-lt strong{font-family:'Fraunces',serif;font-size:13px;font-weight:600;color:#fff;line-height:1.3}
.sb-lt span{font-size:10px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase}
.sb-sec{padding:.75rem 0}
.sb-sec-lbl{padding:.5rem 1.25rem .25rem;font-size:10px;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.1em;font-weight:500}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 1.25rem;font-size:13px;cursor:pointer;color:rgba(255,255,255,.55);transition:background .12s,color .12s;border-left:2px solid transparent}
.nav-item:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.85)}
.nav-item.active{background:rgba(184,149,42,.12);color:var(--gold);border-left-color:var(--gold)}
.nav-item i{font-size:15px;flex-shrink:0}
.nav-badge{margin-left:auto;background:#D97706;color:#fff;font-size:10px;font-weight:600;padding:1px 6px;border-radius:20px;line-height:1.5}
.sb-foot{margin-top:auto;padding:.875rem 1.25rem;border-top:0.5px solid rgba(255,255,255,.08)}
.uchip{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.uavatar{width:30px;height:30px;border-radius:50%;background:rgba(184,149,42,.18);border:0.5px solid rgba(184,149,42,.35);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:var(--gold);flex-shrink:0}
.uinfo p{font-size:12px;font-weight:500;color:#fff}
.uinfo span{font-size:11px;color:rgba(255,255,255,.4)}
.btn-out{display:flex;align-items:center;gap:6px;width:100%;padding:7px 10px;background:rgba(255,255,255,.05);border:0.5px solid rgba(255,255,255,.12);border-radius:8px;font-size:12px;color:rgba(255,255,255,.5);cursor:pointer}
.btn-out:hover{background:rgba(255,255,255,.1);color:rgba(255,255,255,.8)}
.main{flex:1;overflow-y:auto}
.ph{padding:1.25rem 2rem 1rem;border-bottom:0.5px solid var(--color-border-tertiary);background:var(--card-bg);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem}
.ph-left h1{font-family:'Fraunces',serif;font-size:24px;font-weight:600;color:var(--color-text-primary);letter-spacing:-.01em}
.ph-left p{font-size:13px;color:var(--color-text-secondary);margin-top:2px}
.ph-left p{font-size:12px;color:var(--color-text-secondary);margin-top:1px}
.pb{padding:1.5rem 2rem}
.card{background:var(--card-bg);border:0.5px solid var(--color-border-tertiary);border-radius:12px;margin-bottom:1.25rem;overflow:hidden;box-shadow:var(--shadow-sm)}
.card-pad{padding:1.25rem}
.card-accent{border-top:2px solid var(--gold)}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:.5rem}
.ch h3{font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--color-text-secondary)}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.25rem}
.stat-card{background:var(--card-bg);border:0.5px solid var(--color-border-tertiary);border-radius:12px;padding:1rem 1.25rem;border-top:2px solid var(--gold);box-shadow:var(--shadow-sm);transition:box-shadow .15s,transform .15s}
.stat-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.stat-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:4px;background:rgba(184,149,42,.12);color:var(--gold)}
.stat-lbl{font-size:11px;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.stat-val{font-family:'Fraunces',serif;font-size:26px;font-weight:600;line-height:1;color:var(--color-text-primary)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:12px;cursor:pointer;border:0.5px solid var(--color-border-secondary);background:var(--card-bg);color:var(--color-text-primary);font-weight:500;transition:background .12s,box-shadow .12s,transform .08s}
.btn:hover{background:var(--color-background-secondary)}
.btn:active{transform:translateY(1px)}
.btn-primary:hover{box-shadow:0 2px 10px rgba(15,27,46,.25)}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy)}.btn-primary:hover{background:var(--navy-mid)}
.btn-gold{background:var(--gold);color:#fff;border-color:var(--gold)}.btn-gold:hover{background:var(--gold-dark);border-color:var(--gold-dark)}
.btn-r{background:none;color:var(--color-text-danger);border-color:var(--color-border-danger)}.btn-r:hover{background:var(--color-background-danger)}
.btn-b{background:none;color:#185FA5;border-color:rgba(24,95,165,.3)}.btn-b:hover{background:#E6F1FB}
.btn-o{background:none;color:#854F0B;border-color:rgba(133,79,11,.3)}.btn-o:hover{background:#FAEEDA}
.btn-wa{background:#25D366;color:#fff;border-color:#25D366}.btn-wa:hover{background:#1DA851}
.btn-sm{padding:5px 10px;font-size:11px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 12px;font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--color-text-secondary);border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary)}
td{padding:9px 12px;border-bottom:0.5px solid var(--color-border-tertiary);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.row-normal:hover td{background:var(--color-background-secondary)}
tr.row-fest td{background:#FAEEDA !important}
tr.row-fest:hover td{background:#f5e0c0 !important}
tr.row-fest .day-label{color:#633806;font-weight:500}
tr.row-fest .fest-pill{display:inline-flex !important;align-items:center;gap:3px;padding:1px 7px;background:#F0C070;border-radius:999px;font-size:11px;color:#412402;font-weight:500;margin-left:5px}
tr.row-fest .dt-inp,tr.row-fest .ti-inp,tr.row-fest .est-sel{background:#F5E6C8 !important;border-color:#D4A654 !important}
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:500}
.ba{background:#EEEDFE;color:#3C3489}.br{background:#E1F5EE;color:#085041}.bs{background:#FAEEDA;color:#633806}.bc{background:#E6F1FB;color:#0C447C}
.bg-pend{background:#FAEEDA;color:#633806}.bg-proc{background:#E1F5EE;color:#085041}.bg-liq{background:#E6F1FB;color:#0C447C}
.badge-gold{background:rgba(184,149,42,.12);color:var(--gold-dark);border:0.5px solid rgba(184,149,42,.25)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.ff{display:flex;flex-direction:column;gap:5px}
.ff label{font-size:11px;font-weight:500;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.06em}
.ff input,.ff select{padding:8px 10px;border:0.5px solid var(--color-border-secondary);border-radius:8px;background:var(--card-bg);color:var(--color-text-primary);font-size:13px}
.ff input:focus,.ff select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,149,42,.12)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem}
.modal{background:var(--card-bg);border:0.5px solid var(--color-border-secondary);border-radius:14px;width:100%;max-width:960px;max-height:92vh;overflow-y:auto;box-shadow:0 12px 40px rgba(16,20,28,.18)}
.modal-head{padding:1.25rem 1.5rem 1rem;border-bottom:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;gap:10px}
.modal-head-icon{width:32px;height:32px;background:rgba(13,27,42,.07);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-head-icon i{font-size:17px;color:var(--navy)}
.modal-head h3{font-family:'Fraunces',serif;font-size:17px;font-weight:600;color:var(--color-text-primary)}
.modal-body{padding:1.25rem 1.5rem}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding:1rem 1.5rem;border-top:0.5px solid var(--color-border-tertiary);flex-wrap:wrap;background:var(--color-background-secondary)}
.sc-table{overflow-x:auto}
.sc-table table{min-width:740px}
.ti-inp{width:82px;padding:5px 7px;border:0.5px solid var(--color-border-secondary);border-radius:8px;font-size:12px;background:var(--card-bg);color:var(--color-text-primary)}
.ti-inp:focus{outline:none;border-color:var(--gold)}
.ti-inp.inv{border-color:var(--color-text-danger)}
select.est-sel{padding:5px 7px;border:0.5px solid var(--color-border-secondary);border-radius:8px;font-size:12px;background:var(--card-bg);color:var(--color-text-primary)}
.dt-inp{padding:5px 7px;border:0.5px solid var(--color-border-secondary);border-radius:8px;font-size:12px;background:var(--card-bg);color:var(--color-text-primary)}
.table-actions-bar{display:flex;align-items:center;justify-content:space-between;padding:.875rem 1.25rem;border-top:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);gap:.75rem;flex-wrap:wrap}
.btn-add-day{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:8px;font-size:12px;cursor:pointer;border:0.5px dashed rgba(184,149,42,.5);background:transparent;color:var(--gold-dark);font-weight:500}
.btn-add-day:hover{background:rgba(184,149,42,.08)}
.legend-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--color-text-secondary);padding:.5rem 12px}
.legend-sw{width:14px;height:14px;border-radius:3px;background:#FAEEDA;border:0.5px solid #D4A654;flex-shrink:0}
.liq-section{background:var(--color-background-secondary);border-radius:8px;padding:1rem;margin-bottom:1rem}
.liq-section h4{font-size:12px;font-weight:500;margin-bottom:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--color-text-secondary)}
.liq-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:13px}
.liq-row:last-child{border-bottom:none}
.liq-total{display:flex;justify-content:space-between;align-items:center;padding:.875rem 1.25rem;background:var(--navy);border-radius:8px;font-size:14px;font-weight:500;color:#fff;margin-top:.75rem}
.liq-total span:last-child{color:var(--gold)}
.info-box{background:var(--color-background-secondary);border-left:2px solid var(--gold);border-radius:0 8px 8px 0;padding:.75rem 1rem;font-size:12px;color:var(--color-text-secondary);margin-bottom:1rem;line-height:1.6}
.filter-bar{display:flex;gap:.75rem;flex-wrap:wrap;align-items:flex-end}
.filter-bar .ff{flex:1;min-width:130px}
.tabs{display:flex;border-bottom:0.5px solid var(--color-border-tertiary);padding:0 1.25rem}
.tab{padding:10px 14px;font-size:12px;cursor:pointer;color:var(--color-text-secondary);border-bottom:2px solid transparent;margin-bottom:-0.5px;font-weight:500;letter-spacing:.02em;transition:color .12s;text-transform:uppercase}
.tab:hover{color:var(--color-text-primary)}
.tab.active{color:var(--navy);border-bottom-color:var(--gold)}
.casino-group{border:0.5px solid var(--color-border-tertiary);border-radius:12px;margin-bottom:1rem;overflow:hidden}
.casino-group-header{display:flex;align-items:center;justify-content:space-between;padding:.875rem 1.25rem;background:var(--color-background-secondary);gap:.75rem;flex-wrap:wrap;border-left:3px solid var(--gold)}
.cg-title{display:flex;align-items:center;gap:8px;font-weight:500;font-size:13px}
.cg-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.liq-persona-block{border:0.5px solid var(--color-border-tertiary);border-radius:8px;margin-bottom:.75rem;overflow:hidden}
.chk-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px;max-height:180px;overflow-y:auto;border:0.5px solid var(--color-border-tertiary);border-radius:8px;padding:.6rem}
.chk-item{display:flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer}
.perm-mod{border:0.5px solid var(--color-border-tertiary);border-radius:8px;padding:.6rem .75rem;margin-bottom:8px}
.perm-mod-title{font-size:12.5px;font-weight:500;margin-bottom:6px}
.perm-mod-acciones{display:flex;flex-wrap:wrap;gap:10px 16px}
.hist-timeline{position:relative;padding-left:20px}
.hist-item{position:relative;padding-bottom:1.1rem;border-left:2px solid var(--color-border-tertiary);padding-left:16px;margin-left:2px}
.hist-item:last-child{border-left-color:transparent;padding-bottom:0}
.hist-dot{position:absolute;left:-6px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--gold);border:2px solid var(--card-bg)}
.lpb-header{display:flex;align-items:center;justify-content:space-between;padding:.6rem 1rem;background:var(--color-background-secondary);font-size:13px;font-weight:500}
.lpb-body{padding:.75rem 1rem}
.lpb-row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:0.5px solid var(--color-border-tertiary)}
.lpb-row:last-child{border-bottom:none}
.liq-casino-total{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.25rem;background:var(--navy);border-radius:8px;font-size:15px;font-weight:500;color:#fff;margin-top:1rem}
.liq-casino-total span:last-child{color:var(--gold)}
.liq-sub-total{display:flex;justify-content:space-between;align-items:center;padding:.5rem .75rem;background:rgba(184,149,42,.08);border-radius:8px;font-size:13px;color:var(--gold-dark);margin-top:.5rem}
.changes-banner{display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;background:var(--color-background-secondary);border-left:2px solid var(--gold);border-radius:0 8px 8px 0;margin-bottom:1rem;font-size:13px;color:var(--color-text-secondary)}
.empty{text-align:center;padding:3rem;color:var(--color-text-secondary)}
.empty i{font-size:40px;margin-bottom:.75rem;display:block}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:999px;font-size:11px}
hr.div{border:none;border-top:0.5px solid var(--color-border-tertiary);margin:1.5rem 0}
.signatures-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;padding:1.25rem;border-top:0.5px solid var(--color-border-tertiary)}
.sig-block{display:flex;flex-direction:column;gap:8px}
.sig-label{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--color-text-secondary)}
.sig-label i{font-size:14px;color:var(--gold)}
.sig-canvas-wrap{position:relative;border:0.5px solid var(--color-border-secondary);border-radius:8px;background:var(--color-background-secondary);overflow:hidden}
.sig-canvas-wrap canvas{display:block;cursor:crosshair;touch-action:none}
.sig-canvas-wrap.signed{border-color:rgba(184,149,42,.5);background:rgba(184,149,42,.04)}
.sig-hint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;pointer-events:none}
.sig-hint i{font-size:22px;color:var(--color-border-secondary)}
.sig-hint span{font-size:12px;color:var(--color-text-secondary)}
.sig-actions{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
.sig-status{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--color-text-secondary)}
.sig-status.ok{color:#085041}
.sig-status.ok i{color:#1D9E75}
.sig-status.pending{color:#633806}
.btn-clear-sig{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:8px;font-size:11px;cursor:pointer;border:0.5px solid var(--color-border-tertiary);background:transparent;color:var(--color-text-secondary)}
.btn-clear-sig:hover{background:var(--color-background-secondary)}
.sig-remote-box{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:8px;padding:.875rem 1rem}

async function api(method, path, body) {
  const res = await fetch(API + path, {

      'Content-Type': 'application/json',

}
const FEST_FIJOS=['01-01','05-01','07-20','08-07','12-08','12-25'];
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da)}
function addD(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function nextMon(d){const x=new Date(d),dow=x.getDay();if(dow===1)return x;x.setDate(x.getDate()+(dow===0?1:(8-dow)));return x}
function ymd(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function buildFest(y){const s=new Set();FEST_FIJOS.forEach(m=>s.add(`${y}-${m}`));const e=easter(y);[addD(e,-7),addD(e,-3),addD(e,-2),e].forEach(d=>s.add(ymd(d)));[new Date(y,0,6),new Date(y,2,19),addD(e,39),addD(e,60),addD(e,68),new Date(y,5,29),new Date(y,7,15),new Date(y,9,12),new Date(y,10,1),new Date(y,10,11)].forEach(d=>s.add(ymd(nextMon(d))));return s}
const FEST=new Set([...buildFest(2024),...buildFest(2025),...buildFest(2026),...buildFest(2027)]);
function isDomFest(f){if(!f)return false;return new Date(f+'T12:00:00').getDay()===0||FEST.has(f)}
function festLabel(f){if(!f)return'';const d=new Date(f+'T12:00:00').getDay()===0,fe=FEST.has(f);return d&&fe?'Dom · Festivo':d?'Domingo':fe?'Festivo':''}
const DAYS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const SMMLV=1300000;
function getQuincena(f){if(!f)return null;const d=new Date(f+'T12:00:00');return{year:d.getFullYear(),month:d.getMonth(),q:d.getDate()<=15?1:2}}
function quincenaLabel(y,m,q){return`${q===1?'1ª':'2ª'} quincena — ${MESES[m]} ${y}`}
function quincenaKey(y,m,q){return`${y}-${String(m+1).padStart(2,'0')}-Q${q}`}
function quincenaPeriodo(y,m,q){const ini=q===1?`01/${String(m+1).padStart(2,'0')}/${y}`:`16/${String(m+1).padStart(2,'0')}/${y}`;const fin=q===1?`15/${String(m+1).padStart(2,'0')}/${y}`:`${new Date(y,m+1,0).getDate()}/${String(m+1).padStart(2,'0')}/${y}`;return`${ini} – ${fin}`}
function currentQ(){const n=new Date();return{year:n.getFullYear(),month:n.getMonth(),q:n.getDate()<=15?1:2}}
function genQOpts(){const res=[];const now=new Date();for(let m=0;m<7;m++){const d=new Date(now.getFullYear(),now.getMonth()-m,1);const y=d.getFullYear(),mo=d.getMonth();res.push({year:y,month:mo,q:2,key:quincenaKey(y,mo,2),label:quincenaLabel(y,mo,2),periodo:quincenaPeriodo(y,mo,2)});res.push({year:y,month:mo,q:1,key:quincenaKey(y,mo,1),label:quincenaLabel(y,mo,1),periodo:quincenaPeriodo(y,mo,1)})}return res}

  try{

    const h=await res.json();
    const mapped={
      ...h,

function fmtTs(ts){const d=new Date(ts);return d.toLocaleDateString('es-CO',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function rolAsignacion(nombreRol){const r=(S.data.roles||[]).find(x=>x.nombre===nombreRol);return r?r.asignacion:'multi_empresa'}
function buscarHorariosExistentes(texto){
  const u=S.user,e=S.emp,q=S.selQ,qk=quincenaKey(q.year,q.month,q.q);
  const esUnico=u.asignacion==='single_casino';
  const casinoFiltro=esUnico?u.cId:(e.cId||null);
  return S.data.horarios.filter(h=>{
    if(h.estado==='Liquidado')return false;
    if(h.quincenaKey!==qk)return false;
    if(casinoFiltro&&parseInt(h.empleado.cId)!==parseInt(casinoFiltro))return false;
    if(!texto)return true;
    const t=texto.toLowerCase();
    return (h.empleado.nombre||'').toLowerCase().includes(t)||(h.empleado.documento||'').toLowerCase().includes(t);
  });
}
function badgeClass(nombre){const classes=['ba','br','bs','bc'];let h=0;for(let i=0;i<(nombre||'').length;i++)h=(h*31+nombre.charCodeAt(i))>>>0;return classes[h%classes.length]}
function normalizaFecha(f){
  if(!f)return '';
  const s=String(f).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  if(/^\d{4}-\d{2}-\d{2}T/.test(s))return s.split('T')[0];
  try{
    const d=new Date(s);
    if(isNaN(d.getTime()))return '';
    return d.toISOString().split('T')[0];
  }catch(e){return ''}
}
const DIAS_RECORDATORIO=3;
function diasPendientes(h){
  const base=h.creadoEn||h.fechaGuardado;if(!base)return 0;
  return Math.floor((Date.now()-new Date(base).getTime())/(1000*60*60*24));
}

function bLogin(){document.getElementById('lbtn').onclick=doLogin;document.getElementById('lp').onkeypress=e=>{if(e.key==='Enter')doLogin()}}
async function doLogin() {
  const u = document.getElementById('lu').value.trim();
  const p = document.getElementById('lp').value.trim();
  try {
    const data = await api('POST', '/auth/login', { usuario: u, password: p });
    TOKEN = data.token;
    localStorage.setItem('token', TOKEN);
    S.user = { ...data, eId: data.empresa_id, cId: data.casino_id, empresaIds: data.empresa_ids || [], permisos: data.permisos || {}, asignacion: data.asignacion || 'multi_empresa' };
    S.view = 'app';
    S.menu = data.asignacion === 'single_casino' ? 'horarios' : 'dashboard';
    if (data.asignacion === 'single_casino') {
      S.emp.eId = data.empresa_id;
      S.emp.cId = data.casino_id;
    }
    await cargarDatos();
    render();
  } catch {
    S.loginErr = 'Credenciales incorrectas';
    render();
  }
}

async function cargarDatos() {
  const perm = S.user.permisos || {};
  const [empresas, casinos, usuarios, horarios, logs, roles] = await Promise.all([
    api('GET', '/empresas'),
    api('GET', '/casinos'),
    perm.usuarios?.ver ? api('GET', '/usuarios').catch(()=>[]) : Promise.resolve([]),
    api('GET', '/horarios'),
    perm.logs?.ver ? api('GET', '/logs').catch(()=>[]) : Promise.resolve([]),
    S.user.rol === 'Administrador' ? api('GET', '/roles').catch(()=>[]) : Promise.resolve([])
  ]);
  S.data.empresas  = empresas;
  S.data.casinos   = casinos.map(c => ({ ...c, eId: c.empresa_id }));
  S.data.usuarios  = usuarios.map(u => ({ ...u, eId: u.empresa_id, cId: u.casino_id, empresaIds: u.empresa_ids || [] }));
  S.data.roles     = roles;
  S.data.horarios  = horarios.map(h => ({
    ...h,
    sigAdmin: h.sig_admin,
    sigEmpleado: h.sig_empleado,
    quincenaKey: h.quincena_key,
    creadoEn: h.creado_en,
    rows: (h.rows || []).map(r => ({ ...r, fecha: normalizaFecha(r.fecha) })),
    empleado: {
      nombre: h.empleado_nombre,
      documento: h.empleado_documento,
      cargo: h.empleado_cargo,
      eId: h.empresa_id,
      cId: h.casino_id
    },
    quincena: {
      year: h.quincena_year,
      month: h.quincena_mes,
      q: h.quincena_q
    }
  }));
  S.data.logs = logs.map(l => ({ id: l.id, tipo: l.tipo, desc: l.descripcion, detalle: l.detalle, usuario: l.usuario, ts: l.ts, horarioId: l.horario_id }));
}

  if(p.empresas?.ver)general.push(['empresas','ti-building-store','Empresas']);
  if(p.usuarios?.ver)general.push(['usuarios','ti-users','Usuarios']);
  if(p.horarios_consulta?.ver)general.push(['consulta','ti-search','Consulta horarios']);
  const operaciones=[];
  if(p.horarios_registro?.crear)operaciones.push(['horarios','ti-calendar-event','Registrar horario']);
  const sistema=[];

  if(rol==='Administrador')sistema.push(['roles','ti-shield-lock','Roles y permisos']);
  const secciones=[{l:'General',items:general}];
  if(operaciones.length)secciones.push({l:'Operaciones',items:operaciones});
  if(sistema.length)secciones.push({l:'Sistema',items:sistema});
  return secciones.map(s=>`<div class="sb-sec"><div class="sb-sec-lbl">${s.l}</div>
    ${s.items.map(([id,ic,lb])=>`<div class="nav-item${S.menu===id?' active':''}" data-menu="${id}"><i class="ti ${ic}"></i>${lb}${id==='dashboard'&&nPend?`<span class="nav-badge">${nPend}</span>`:''}</div>`).join('')}
  </div>`).join('');
}

</div>${S.modal?rModal():''}`}
function rPage(){switch(S.menu){case'dashboard':return rDash();case'empresas':return rEmpresas();case'usuarios':return rUsuarios();case'horarios':return rHorarios();case'consulta':return rConsulta();case'logs':return rLogs();case'roles':return rRoles();default:return rDash()}}

/* ── DASHBOARD ── */
function rDash(){
  const{empresas,casinos,usuarios,horarios,logs}=S.data,u=S.user,p=u.permisos||{};
  const esUnico=u.asignacion==='single_casino';
  const restringido=!esUnico&&u.rol!=='Administrador'&&u.empresaIds&&u.empresaIds.length>0;
  const verEmpresas=!!p.empresas?.ver;
  const verUsuarios=!!p.usuarios?.ver;
  const verHorarios=!!(p.horarios_consulta?.ver||p.horarios_registro?.crear||p.horarios_registro?.editar||p.horarios_registro?.liquidar);
  const verLogs=!!p.logs?.ver;

  // Alcance: limitar los datos a la empresa/casino del usuario cuando aplica
  const empresasVisibles=esUnico?empresas.filter(e=>e.id===u.eId):restringido?empresas.filter(e=>u.empresaIds.includes(e.id)):empresas;
  const casinosVisibles=esUnico?casinos.filter(c=>c.id===u.cId):restringido?casinos.filter(c=>u.empresaIds.includes(c.eId)):casinos;
  const horariosVisibles=esUnico?horarios.filter(h=>parseInt(h.empleado.cId)===parseInt(u.cId)):restringido?horarios.filter(h=>u.empresaIds.includes(parseInt(h.empleado.eId))):horarios;

  const pendientes=verHorarios?getPendientesFirma().filter(h=>esUnico?parseInt(h.empleado.cId)===parseInt(u.cId):(!restringido||u.empresaIds.includes(parseInt(h.empleado.eId)))):[];

  const stats=[];
  if(verEmpresas)stats.push(`<div class="stat-card"><div class="stat-icon"><i class="ti ti-building-store" style="font-size:16px"></i></div><div class="stat-lbl">Empresas</div><div class="stat-val">${empresasVisibles.length}</div></div>`);
  if(verEmpresas)stats.push(`<div class="stat-card"><div class="stat-icon"><i class="ti ti-diamond" style="font-size:16px"></i></div><div class="stat-lbl">Casinos</div><div class="stat-val">${casinosVisibles.length}</div></div>`);
  if(verUsuarios)stats.push(`<div class="stat-card"><div class="stat-icon"><i class="ti ti-users" style="font-size:16px"></i></div><div class="stat-lbl">Usuarios</div><div class="stat-val">${usuarios.length}</div></div>`);
  if(verHorarios)stats.push(`<div class="stat-card"><div class="stat-icon"><i class="ti ti-calendar-check" style="font-size:16px"></i></div><div class="stat-lbl">Horarios</div><div class="stat-val">${horariosVisibles.length}</div></div>`);

  const sinNada=!stats.length&&!pendientes.length&&!verLogs&&!verEmpresas;

  return`<div class="ph"><div class="ph-left"><h1>Panel principal</h1><p>Resumen general del sistema</p></div></div>
  <div class="pb">
    ${stats.length?`<div class="stats-grid">${stats.join('')}</div>`:''}
    ${pendientes.length?`<div class="card card-pad" style="margin-bottom:1.25rem;border-left:3px solid #D97706">
      <div class="ch"><h3><i class="ti ti-bell-ringing" style="color:#D97706;font-size:15px;vertical-align:-2px;margin-right:4px"></i>Recordatorio — firmas pendientes</h3><span class="badge" style="background:#FEF3C7;color:#92400E">${pendientes.length}</span></div>
      <p style="font-size:12px;color:var(--color-text-secondary);margin:-4px 0 10px">Llevan ${DIAS_RECORDATORIO}+ días esperando la firma del empleado.</p>
      ${pendientes.slice(0,8).map(h=>{const cas=casinos.find(c=>c.id===parseInt(h.empleado.cId)),d=diasPendientes(h);
        return`<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:0.5px solid var(--color-border-tertiary)">
          <div><span style="font-weight:500;font-size:13px">${h.empleado.nombre}</span><span style="font-size:11px;color:var(--color-text-secondary);margin-left:6px">${cas?cas.nombre:'—'}</span></div>
          <div style="display:flex;align-items:center;gap:8px"><span class="badge" style="background:#FEF3C7;color:#92400E;font-size:10px">${d} día${d!==1?'s':''}</span>
          <button class="btn btn-sm btn-wa" data-wa="${h.id}"><i class="ti ti-brand-whatsapp"></i></button></div>
        </div>`}).join('')}
      ${pendientes.length>8?`<div style="font-size:11px;color:var(--color-text-secondary);margin-top:8px">+ ${pendientes.length-8} más...</div>`:''}
    </div>`:''}
    ${verLogs?`<div class="card card-pad" style="margin-bottom:1.25rem">
      <div class="ch"><h3>Últimos eventos</h3><button class="btn btn-sm" id="dash-logs-btn">Ver todos</button></div>
      ${logs.slice(0,5).map(l=>`<div style="display:flex;align-items:flex-start;gap:10px;padding:6px 0;border-bottom:0.5px solid var(--color-border-tertiary)">
        <span class="log-chip ${LOG_CSS[l.tipo]||'log-save'}" style="flex-shrink:0">${LOG_LABELS[l.tipo]||l.tipo}</span>
        <span style="font-size:12px;flex:1">${l.desc}</span>
        <span style="font-size:11px;color:var(--color-text-secondary);white-space:nowrap">${fmtTs(l.ts)}</span>
      </div>`).join('')}
      ${!logs.length?'<div style="font-size:13px;color:var(--color-text-secondary);padding:.75rem 0">Sin eventos aún.</div>':''}
    </div>`:''}
    ${verEmpresas?empresasVisibles.map(e=>{const cs=casinosVisibles.filter(c=>c.eId===e.id);return`<div class="card card-pad" style="margin-bottom:1rem">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:.875rem">
        <i class="ti ti-building-store" style="font-size:15px;color:var(--gold)"></i>
        <span style="font-weight:500;font-size:14px">${e.nombre}</span>
        <span class="badge badge-gold">${cs.length} casino${cs.length!==1?'s':''}</span>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">${cs.map(c=>`<span style="display:inline-flex;align-items:center;gap:5px;padding:4px 10px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:999px;font-size:12px"><i class="ti ti-diamond" style="font-size:11px;color:var(--gold)"></i>${c.nombre}</span>`).join('')}</div>
    </div>`}).join(''):''}
    ${sinNada?`<div class="card card-pad" style="text-align:center;padding:2.5rem 1rem;color:var(--color-text-secondary)">
      <i class="ti ti-layout-dashboard" style="font-size:28px;opacity:.4"></i>
      <p style="margin-top:.5rem;font-size:13px">Tu rol no tiene secciones para mostrar aquí. Usa el menú lateral para ir directo a tus tareas.</p>
    </div>`:''}
  </div>`;
}

/* ── TABLA DÍAS ── */
function renderRowsTable(rows,isEdit,showSave,saveLabel){
  const addId=isEdit?'edit-add-row':'add-row';
  const saveBtn=showSave?`<button class="btn btn-primary" id="save-sch"><i class="ti ti-device-floppy"></i>${saveLabel||'Guardar horario'}</button>`:'';
  const rowsHtml=rows.length===0?`<div class="empty"><i class="ti ti-calendar-off"></i><p>Aún no hay días registrados.</p></div>`
    :`<div class="sc-table"><table><thead><tr><th>Fecha</th><th>Día</th><th>Estado</th><th>Entrada</th><th>Salida</th><th>Horas</th><th></th></tr></thead>
      <tbody>${rows.map((r,i)=>{
        const dayIndex=r.fecha?new Date(r.fecha+'T12:00:00').getDay():null;
        const dn=dayIndex!==null&&dayIndex!==undefined?DAYS[dayIndex]:'—';
        const isH=r.estado==='Horario',fest=isDomFest(r.fecha),fl=festLabel(r.fecha);
        const hrs=isH&&r.entrada&&r.salida&&!r.entradaErr&&!r.salidaErr?calcHrs(r.entrada,r.salida):null;
        return`<tr class="${fest?'row-fest':'row-normal'}">
          <td><input class="dt-inp" type="date" data-r="${i}" data-f="fecha" data-em="${isEdit?1:0}" value="${normalizaFecha(r.fecha)}"></td>
          <td><span class="day-label">${dn}</span>${fest?`<span class="fest-pill"><i class="ti ti-sun" style="font-size:11px"></i>${fl}</span>`:''}</td>
          <td><select class="est-sel" data-r="${i}" data-f="estado" data-em="${isEdit?1:0}">
            <option value="Horario" ${r.estado==='Horario'?'selected':''}>Horario</option>
            <option value="Compensatorio" ${r.estado==='Compensatorio'?'selected':''}>Compensatorio</option>
            <option value="Incapacidad" ${r.estado==='Incapacidad'?'selected':''}>Incapacidad</option>
            <option value="Vacaciones" ${r.estado==='Vacaciones'?'selected':''}>Vacaciones</option>
          </select></td>
          <td>${isH?`<input class="ti-inp${r.entradaErr?' inv':''}" type="text" maxlength="5" placeholder="00:00" data-r="${i}" data-f="entrada" data-em="${isEdit?1:0}" value="${r.entrada||''}">`:'<span style="font-size:12px;color:var(--color-text-secondary)">—</span>'}</td>
          <td>${isH?`<input class="ti-inp${r.salidaErr?' inv':''}" type="text" maxlength="5" placeholder="00:00" data-r="${i}" data-f="salida" data-em="${isEdit?1:0}" value="${r.salida||''}">`:'<span style="font-size:12px;color:var(--color-text-secondary)">—</span>'}</td>
          <td style="font-size:12px;color:var(--color-text-secondary)">${hrs!==null?hrs.toFixed(2)+'h':'—'}</td>
          <td>${isEdit?`<button class="btn btn-sm btn-r" data-edr="${i}"><i class="ti ti-trash"></i></button>`:`<button class="btn btn-sm btn-r" data-dr="${i}"><i class="ti ti-trash"></i></button>`}</td>
        </tr>`;}).join('')}
      </tbody></table>
      <div class="legend-row"><div class="legend-sw"></div><span>Domingo o festivo colombiano</span></div>
    </div>`;
  return`${rowsHtml}<div class="table-actions-bar">
    <button class="btn-add-day" id="${addId}"><i class="ti ti-calendar-plus"></i>Agregar día</button>
    ${saveBtn}
  </div>`;
}

function rTabHistorial(){
  const{horarios,casinos}=S.data,f=S.histFiltro;
  const restringido=S.user.rol!=='Administrador'&&S.user.empresaIds&&S.user.empresaIds.length>0;
  const empresas=restringido?S.data.empresas.filter(e=>S.user.empresaIds.includes(e.id)):S.data.empresas;
  const selE=f.eId?parseInt(f.eId):null,avCas=selE?casinos.filter(c=>c.eId===selE):(restringido?casinos.filter(c=>S.user.empresaIds.includes(c.eId)):casinos);
  let lista=horarios;
  if(restringido)lista=lista.filter(h=>S.user.empresaIds.includes(parseInt(h.empleado.eId)));
  if(selE)lista=lista.filter(h=>parseInt(h.empleado.eId)===selE);
  if(f.cId)lista=lista.filter(h=>parseInt(h.empleado.cId)===parseInt(f.cId));
  const byMes={};
  lista.forEach(h=>{if(!h.quincena)return;const{year,month,q}=h.quincena,mesKey=`${year}-${String(month+1).padStart(2,'0')}`,qk=quincenaKey(year,month,q);if(!byMes[mesKey])byMes[mesKey]={year,month,quincenas:{}};if(!byMes[mesKey].quincenas[qk])byMes[mesKey].quincenas[qk]={year,month,q,key:qk,horarios:[]};byMes[mesKey].quincenas[qk].horarios.push(h)});
  const mesesKeys=Object.keys(byMes).sort().reverse();
  return`<div class="card card-pad">
    <div class="ch"><h3>Filtros de historial</h3></div>
    <div class="filter-bar">
      <div class="ff"><label>Empresa</label><select id="h-emp"><option value="">Todas</option>${empresas.map(e=>`<option value="${e.id}" ${selE===e.id?'selected':''}>${e.nombre}</option>`).join('')}</select></div>
      <div class="ff"><label>Casino</label><select id="h-cas"><option value="">Todos</option>${avCas.map(c=>`<option value="${c.id}" ${parseInt(f.cId)===c.id?'selected':''}>${c.nombre}</option>`).join('')}</select></div>
    </div>
  </div>
  ${mesesKeys.length===0?`<div class="card card-pad"><div class="empty"><i class="ti ti-history"></i><p>Sin historial. Guarda horarios para verlos aquí.</p></div></div>`:''}
  ${mesesKeys.map(mKey=>{
    const mes=byMes[mKey];
    const totalH=Object.values(mes.quincenas).reduce((a,q)=>a+q.horarios.reduce((b,h)=>b+h.rows.filter(r=>r.estado==='Horario'&&r.entrada&&r.salida&&!r.entradaErr&&!r.salidaErr).reduce((c,r)=>c+calcHrs(r.entrada,r.salida),0),0),0);
    const totalHors=Object.values(mes.quincenas).reduce((a,q)=>a+q.horarios.length,0);
    const isExpMes=S.histFiltro.expandedMes===mKey;
    return`<div class="historial-mes">
      <div class="hm-header" data-expand-mes="${mKey}">
        <div class="hm-title"><i class="ti ti-calendar-month" style="font-size:16px;color:var(--gold)"></i>${MESES[mes.month]} ${mes.year}</div>
        <div class="hm-meta">
          <span class="tag" style="color:#fff;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2)">${totalHors} horario${totalHors!==1?'s':''}</span>
          <span class="tag" style="color:#fff;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2)">${totalH.toFixed(1)}h</span>
          <span class="tag" style="color:#fff;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2)">${Object.keys(mes.quincenas).length} quincena${Object.keys(mes.quincenas).length!==1?'s':''}</span>
          <i class="ti ${isExpMes?'ti-chevron-up':'ti-chevron-down'}" style="color:rgba(255,255,255,.6);font-size:14px"></i>
        </div>
      </div>
      ${isExpMes?`<div>
        ${Object.values(mes.quincenas).sort((a,b)=>b.q-a.q).map(qg=>{
          const isExpQ=S.histFiltro.expandedQ===qg.key;
          const qTotalH=qg.horarios.reduce((a,h)=>a+h.rows.filter(r=>r.estado==='Horario'&&r.entrada&&r.salida&&!r.entradaErr&&!r.salidaErr).reduce((b,r)=>b+calcHrs(r.entrada,r.salida),0),0);
          const liqCount=qg.horarios.filter(h=>h.estado==='Liquidado').length;
          return`<div class="q-group">
            <div class="q-group-header" data-expand-q="${qg.key}">
              <div class="q-group-title">
                <span class="periodo-badge ${qg.q===1?'periodo-q1':'periodo-q2'}"><i class="ti ti-calendar-week" style="font-size:11px"></i>${qg.q===1?'1ª':'2ª'} Quincena</span>
                <span style="font-size:12px;color:var(--color-text-secondary)">${quincenaPeriodo(qg.year,qg.month,qg.q)}</span>
              </div>
              <div class="q-group-meta">
                <span class="tag">${qg.horarios.length} empleado${qg.horarios.length!==1?'s':''}</span>
                <span class="tag">${qTotalH.toFixed(1)}h</span>
                <span class="badge ${liqCount===qg.horarios.length?'bg-liq':'bg-pend'}">${liqCount}/${qg.horarios.length} liquidados</span>
                <button class="btn btn-sm btn-gold" data-liq-q="${qg.key}"><i class="ti ti-calculator"></i>Liquidar Q</button>
                <i class="ti ${isExpQ?'ti-chevron-up':'ti-chevron-down'}" style="font-size:13px;color:var(--color-text-secondary)"></i>
              </div>
            </div>
            ${isExpQ?`<table><thead><tr><th>Empleado</th><th>Casino</th><th>Días</th><th>Horas</th><th>Firmas</th><th>Estado</th><th>Acciones</th></tr></thead>
              <tbody>${qg.horarios.map(h=>{
                const cas=casinos.find(c=>c.id===parseInt(h.empleado.cId));
                const st=h.estado||'Pendiente',sb={Pendiente:'bg-pend',Procesado:'bg-proc',Liquidado:'bg-liq'}[st]||'bg-pend';
                const hT=h.rows.filter(r=>r.estado==='Horario'&&r.entrada&&r.salida&&!r.entradaErr&&!r.salidaErr).reduce((a,r)=>a+calcHrs(r.entrada,r.salida),0);
                return`<tr class="row-normal">
                  <td><span style="font-weight:500">${h.empleado.nombre}</span></td>
                  <td style="font-size:12px">${cas?cas.nombre:'—'}</td>
                  <td><span class="tag">${h.rows.length}</span></td>
                  <td style="font-size:12px;color:var(--color-text-secondary)">${hT>0?hT.toFixed(1)+'h':'—'}</td>
                  <td>${sigStatus(h)}</td>
                  <td><span class="badge ${sb}">${st}</span></td>
                  <td><div style="display:flex;gap:4px">
                    ${S.user.permisos?.horarios_registro?.editar&&h.estado!=='Liquidado'?`<button class="btn btn-sm btn-b" data-edit="${h.id}"><i class="ti ti-edit"></i></button>`:''}
                    ${S.user.permisos?.horarios_registro?.liquidar&&h.estado!=='Liquidado'?`<button class="btn btn-sm btn-o" data-liq="${h.id}"><i class="ti ti-calculator"></i></button>`:''}
                    <button class="btn btn-sm btn-wa" data-wa="${h.id}"><i class="ti ti-brand-whatsapp"></i></button>
                    ${S.user.permisos?.horarios_registro?.eliminar?`<button class="btn btn-sm btn-r" data-dh="${h.id}"><i class="ti ti-trash"></i></button>`:''}
                  </div></td>
                </tr>`;}).join('')}
              </tbody></table>`:''}
          </div>`;}).join('')}
      </div>`:''}
    </div>`;
  }).join('')}`;
}

function sigStatus(h){
  const a=!!h.sigAdmin,e=!!h.sigEmpleado;
  if(a&&e)return`<span style="font-size:11px;color:#085041"><i class="ti ti-writing-sign" style="color:#1D9E75;font-size:12px"></i> Completas</span>`;
  if(a)return`<span style="font-size:11px;color:var(--gold-dark)"><i class="ti ti-writing-sign" style="color:var(--gold);font-size:12px"></i> Admin</span>`;
  if(e)return`<span style="font-size:11px;color:#0C447C"><i class="ti ti-writing-sign" style="font-size:12px"></i> Empleado</span>`;
  return`<span style="font-size:11px;color:var(--color-text-secondary)">Sin firmas</span>`;
}

/* ── CÁLCULOS ── */
function calcHrs(ent,sal){const[eh,em]=ent.split(':').map(Number),[sh,sm]=sal.split(':').map(Number);let m=(sh*60+sm)-(eh*60+em);if(m<0)m+=1440;return m/60}
function getMin(t){const[h,m]=t.split(':').map(Number);return h*60+m}
function clasificar(fecha,entrada,salida){
  const esDomFest=new Date(fecha+'T12:00:00').getDay()===0||FEST.has(fecha);
  let minEnt=getMin(entrada),minSal=getMin(salida);if(minSal<=minEnt)minSal+=1440;
  let hOrd=0,hExtra=0,hNoctOrd=0,hNoctExtra=0,hDomFest=0,hDomFestExtra=0,hNoctDom=0;
  for(let m=minEnt;m<minSal;m++){const minR=m%1440,hM=Math.floor(minR/60),esNoct=hM>=21||hM<6,esExtra=(m-minEnt)/60>=8;
    if(esDomFest){if(esNoct)hNoctDom+=1/60;else if(esExtra)hDomFestExtra+=1/60;else hDomFest+=1/60}
    else{if(esNoct){if(esExtra)hNoctExtra+=1/60;else hNoctOrd+=1/60}else{if(esExtra)hExtra+=1/60;else hOrd+=1/60}}}
  return{hOrd,hExtra,hNoctOrd,hNoctExtra,hDomFest,hDomFestExtra,hNoctDom};
}
function liquidarUno(h){
  const vH=SMMLV/240,rows=h.rows.filter(r=>r.estado==='Horario'&&r.fecha&&r.entrada&&r.salida&&!r.entradaErr&&!r.salidaErr);
  let tot={hOrd:0,hExtra:0,hNoctOrd:0,hNoctExtra:0,hDomFest:0,hDomFestExtra:0,hNoctDom:0};
  rows.forEach(r=>{const c=clasificar(r.fecha,r.entrada,r.salida);Object.keys(tot).forEach(k=>tot[k]+=c[k])});
  const REC={hOrd:{r:0,l:'Hora ordinaria'},hExtra:{r:.25,l:'Extra diurna'},hNoctOrd:{r:.35,l:'Recargo nocturno'},hNoctExtra:{r:.75,l:'Extra nocturna'},hDomFest:{r:.75,l:'Dom/festivo'},hDomFestExtra:{r:1.0,l:'Extra dom/fest'},hNoctDom:{r:1.1,l:'Nocturna dom/fest'}};
  let total=0;
  const desglose=Object.keys(tot).map(k=>{const hh=tot[k],{r,l}=REC[k],val=hh*vH*(1+r);total+=val;return{k,l,h:hh,r,val}}).filter(x=>x.h>0.01);
  const vacD=h.rows.filter(r=>r.estado==='Vacaciones').length,cmpD=h.rows.filter(r=>r.estado==='Compensatorio').length,incD=h.rows.filter(r=>r.estado==='Incapacidad').length;
  const vacV=vacD*(SMMLV/30),cmpV=cmpD*(SMMLV/30),incV=incD*(SMMLV/30)*0.667;
  total+=vacV+cmpV+incV;return{desglose,vacD,cmpD,incD,vacV,cmpV,incV,total,vH};
}
function fmt(n){return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n)}

function bPortal(hId){
  const canvas=document.getElementById('sig-canvas-portal');if(!canvas)return;
  const wrap=document.getElementById('sig-wrap-portal'),hint=document.getElementById('sig-hint-portal'),statusEl=document.getElementById('portal-sig-status');
  canvas.width=canvas.offsetWidth||480;canvas.height=130;
  const ctx=canvas.getContext('2d');ctx.strokeStyle='#0D1B2A';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';
  let drawing=false,lx=0,ly=0,hasSig=false;
  function gp(e){const r=canvas.getBoundingClientRect();if(e.touches)return{x:(e.touches[0].clientX-r.left)*(canvas.width/r.width),y:(e.touches[0].clientY-r.top)*(canvas.height/r.height)};return{x:(e.clientX-r.left)*(canvas.width/r.width),y:(e.clientY-r.top)*(canvas.height/r.height)}}
  function start(e){e.preventDefault();drawing=true;const p=gp(e);lx=p.x;ly=p.y;if(hint)hint.style.opacity='0'}
  function move(e){e.preventDefault();if(!drawing)return;const p=gp(e);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p.x,p.y);ctx.stroke();lx=p.x;ly=p.y;hasSig=true}
  function end(e){e.preventDefault();drawing=false;if(hasSig){wrap.classList.add('signed');if(statusEl){statusEl.className='sig-status ok';statusEl.innerHTML='<i class="ti ti-circle-check"></i>Firma lista'}}}
  canvas.addEventListener('mousedown',start);canvas.addEventListener('mousemove',move);canvas.addEventListener('mouseup',end);canvas.addEventListener('mouseleave',end);
  canvas.addEventListener('touchstart',start,{passive:false});canvas.addEventListener('touchmove',move,{passive:false});canvas.addEventListener('touchend',end);
  document.getElementById('portal-clear-sig')?.addEventListener('click',()=>{ctx.clearRect(0,0,canvas.width,canvas.height);hasSig=false;wrap.classList.remove('signed');if(hint)hint.style.opacity='1';if(statusEl){statusEl.className='sig-status';statusEl.innerHTML='<i class="ti ti-circle-dashed"></i>Sin firma'}});

    try{
      const res=await fetch(API+'/horarios/'+hId+'/firma-empleado',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({sig_empleado:sigData})});
      if(!res.ok)throw new Error('fallo al guardar');
    }catch(err){alert('No se pudo guardar la firma. Intenta de nuevo.');if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-check"></i>Confirmar y enviar firma'}return}
    if(h)h.sigEmpleado=sigData;
    window.location.hash='';
    document.getElementById('app').innerHTML=`<div class="portal-wrap"><div class="portal-card">
      <div class="portal-head"><div class="logo-mark"><i class="ti ti-diamond"></i></div><div><strong style="font-size:14px">Sistema de Horarios</strong></div></div>
      <div class="portal-done"><i class="ti ti-circle-check"></i><h3>¡Firma registrada!</h3><p>Tu firma fue guardada exitosamente. Puedes cerrar esta ventana.</p></div>
    </div></div>`;
  });
}

async function persistHorario(h){
  const body={
    empleado_nombre:h.empleado.nombre,
    empleado_documento:h.empleado.documento,
    empleado_cargo:h.empleado.cargo,
    empresa_id:h.empleado.eId?parseInt(h.empleado.eId):null,
    casino_id:h.empleado.cId?parseInt(h.empleado.cId):null,
    estado:h.estado,
    sig_admin:h.sigAdmin||null,
    sig_empleado:h.sigEmpleado||null,
    rows:h.rows
  };
  await api('PUT','/horarios/'+h.id,body);
}
async function commitEdit(){
  const h=S.editHorario,orig=getH(h.id);let ok=true;
  h.rows.forEach((r,i)=>{if(r.estado==='Horario'){h.rows[i].entradaErr=!valTime(r.entrada)||!r.entrada;h.rows[i].salidaErr=!valTime(r.salida)||!r.salida;if(h.rows[i].entradaErr||h.rows[i].salidaErr)ok=false}});
  if(!ok){render();return false}
  h.estado='Procesado';
  try{ await persistHorario(h); }catch(err){ alert('No se pudo guardar el horario: '+(err?.error||'error desconocido')); return false; }
  if(orig){
    const emp=h.empleado,oemp=orig.empleado;
    if(emp.nombre!==oemp.nombre)addLog('edit',`Horario #${h.id}: nombre cambiado`,`"${oemp.nombre}" → "${emp.nombre}"`,null,h.id);
    if(emp.cargo!==oemp.cargo)addLog('edit',`Horario #${h.id}: cargo cambiado`,`"${oemp.cargo||'—'}" → "${emp.cargo||'—'}"`,null,h.id);
    if(emp.cId!==oemp.cId)addLog('edit',`Horario #${h.id}: casino cambiado`,`"${getCasNombre(oemp.cId)}" → "${getCasNombre(emp.cId)}"`,null,h.id);
    const rowsDiff=h.rows.length-orig.rows.length;
    if(rowsDiff>0)addLog('row-add',`Horario #${h.id}: ${rowsDiff} día${rowsDiff!==1?'s':''} agregado${rowsDiff!==1?'s':''}`,`Empleado: ${emp.nombre}`,null,h.id);
    if(rowsDiff<0)addLog('row-del',`Horario #${h.id}: ${Math.abs(rowsDiff)} día${Math.abs(rowsDiff)!==1?'s':''} eliminado${Math.abs(rowsDiff)!==1?'s':''}`,`Empleado: ${emp.nombre}`,null,h.id);
    orig.rows.forEach((or,i)=>{const nr=h.rows[i];if(!nr)return;if(nr.fecha!==or.fecha||nr.entrada!==or.entrada||nr.salida!==or.salida||nr.estado!==or.estado)addLog('row-edit',`Horario #${h.id}: fila ${i+1} modificada`,`${nr.fecha||'—'} · ${nr.estado}${nr.estado==='Horario'?` ${nr.entrada||'?'}–${nr.salida||'?'}`:''}`,null,h.id)});
    if(JSON.stringify(h.rows)!==JSON.stringify(orig.rows)||JSON.stringify(h.empleado)!==JSON.stringify(orig.empleado))addLog('edit',`Horario #${h.id} guardado con cambios`,`Empleado: ${emp.nombre}${h.quincena?' · '+quincenaLabel(h.quincena.year,h.quincena.month,h.quincena.q):''}`,null,h.id);
  }
  const idx=S.data.horarios.findIndex(x=>x.id===h.id);
  if(idx>-1){S.data.horarios[idx]=JSON.parse(JSON.stringify(h))}
  S.editHorario=null;return true;
}
function valTime(v){if(!v)return true;const m=v.match(/^(\d{1,2}):(\d{2})$/);if(!m)return false;return+m[1]<=23&&+m[2]<=59}
async function saveSchedule(){
  let ok=true;
  S.rows.forEach((r,i)=>{if(r.estado==='Horario'){S.rows[i].entradaErr=!valTime(r.entrada)||!r.entrada;S.rows[i].salidaErr=!valTime(r.salida)||!r.salida;if(S.rows[i].entradaErr||S.rows[i].salidaErr)ok=false}});
  if(!ok){render();return}
  const e=S.emp;if(!e.nombre||!e.cId){alert('Completa nombre y casino del empleado');return}
  const q=S.selQ;
  const rows=JSON.parse(JSON.stringify(S.rows)).map(r=>({...r,fecha:normalizaFecha(r.fecha)}));

  if(S.editandoHorarioId){
    const hId=S.editandoHorarioId,orig=getH(hId);
    const perdioFirma=!!(orig&&orig.sigEmpleado);
    const body={
      empleado_nombre:e.nombre,empleado_documento:e.documento,empleado_cargo:e.cargo,
      empresa_id:e.eId?parseInt(e.eId):null,casino_id:e.cId?parseInt(e.cId):null,
      estado:'Pendiente',sig_admin:SIG.admin||orig?.sigAdmin||null,sig_empleado:perdioFirma?null:(orig?.sigEmpleado||null),
      rows
    };
    try{ await api('PUT','/horarios/'+hId,body); }catch(err){ alert('No se pudo actualizar el horario: '+(err?.error||'error desconocido')); return; }
    const idx=S.data.horarios.findIndex(x=>x.id===hId);
    if(idx>-1)S.data.horarios[idx]={...S.data.horarios[idx],empleado:{...e},rows,estado:'Pendiente',sigAdmin:body.sig_admin,sigEmpleado:body.sig_empleado};
    addLog('edit',`Horario #${hId} actualizado — días agregados/editados`,`Empleado: ${e.nombre} · ${rows.length} días totales${perdioFirma?' · Firma del empleado reiniciada por el cambio':''}`,null,hId);
    S.rows=[];S.emp={nombre:'',documento:'',cargo:'',cId:S.user.cId||'',eId:S.user.eId||''};SIG.admin=null;S.editandoHorarioId=null;S.buscarEmp='';S.resultadosBusqueda=[];
    S.modal='firma-link';S.mdata={hId};render();
    return;
  }

  const body={
    empleado_nombre:e.nombre,empleado_documento:e.documento,empleado_cargo:e.cargo,
    empresa_id:e.eId?parseInt(e.eId):null,casino_id:e.cId?parseInt(e.cId):null,
    quincena_year:q.year,quincena_mes:q.month,quincena_q:q.q,quincena_key:quincenaKey(q.year,q.month,q.q),
    sig_admin:SIG.admin||null,rows
  };
  let saved;
  try{ saved=await api('POST','/horarios',body); }catch(err){ alert('No se pudo guardar el horario: '+(err?.error||'error desconocido')); return; }
  const newH={
    id:saved.id,empleado:{...e},rows,estado:'Pendiente',fechaGuardado:new Date().toISOString(),
    sigAdmin:SIG.admin||null,sigEmpleado:null,quincena:{...q},quincenaKey:quincenaKey(q.year,q.month,q.q)
  };
  S.data.horarios.push(newH);
  addLog('save',`Horario creado — empleado: ${e.nombre}`,`Casino: ${getCasNombre(e.cId)} · ${quincenaLabel(q.year,q.month,q.q)} · ${S.rows.length} días${SIG.admin?' · Con firma admin':''}`,null,newH.id);
  S.rows=[];S.emp={nombre:'',documento:'',cargo:'',cId:S.user.cId||'',eId:S.user.eId||''};SIG.admin=null;
  S.modal='firma-link';S.mdata={hId:newH.id};render();
}

function bindRowInputs(){
  document.querySelectorAll('[data-r][data-f]').forEach(el=>{
    const isEdit=el.dataset.em==='1',arr=()=>isEdit&&S.editHorario?S.editHorario.rows:S.rows;
    el.addEventListener('change',()=>{
      const i=parseInt(el.dataset.r),f=el.dataset.f,rows=arr();if(!rows[i])return;
      const prev={...rows[i]};
      if(f==='estado'){rows[i][f]=el.value;if(isEdit)addLog('estado',`Horario #${S.editHorario?.id}: estado fila ${i+1}`,`${prev.estado} → ${el.value}`,null,S.editHorario?.id);return}
      if(f==='fecha'){rows[i][f]=el.value;if(isEdit&&el.value)addLog('row-edit',`Horario #${S.editHorario?.id}: fecha fila ${i+1}`,`${prev.fecha||'—'} → ${el.value}`,null,S.editHorario?.id);return}
      const v=el.value.replace(/[^0-9:]/g,'');rows[i][f]=v;rows[i][f+'Err']=!valTime(v);
      if(isEdit&&v&&!rows[i][f+'Err'])addLog('row-edit',`Horario #${S.editHorario?.id}: hora ${f} fila ${i+1}`,`${prev[f]||'—'} → ${v}`,null,S.editHorario?.id);
    });
    if(el.classList.contains('ti-inp')){el.addEventListener('input',()=>{let v=el.value.replace(/[^0-9]/g,'');if(v.length>4)v=v.slice(0,4);if(v.length>2)v=v.slice(0,2)+':'+v.slice(2);el.value=v})}
  });
}
async function handleSave(){
  if(S.modal==='new-empresa'){
    const n=document.getElementById('mn').value.trim();if(!n)return;
    const nit=document.getElementById('mnit').value.trim();
    const editId=S.mdata?.editId;
    try{
      if(editId){
        const updated=await api('PUT','/empresas/'+editId,{nombre:n,nit});
        const idx=S.data.empresas.findIndex(x=>x.id===editId);
        if(idx>-1)S.data.empresas[idx]=updated;
        addLog('edit',`Empresa editada: ${n}`);
      }else{
        const created=await api('POST','/empresas',{nombre:n,nit});
        S.data.empresas.push(created);addLog('create',`Empresa creada: ${n}`);
      }
    }catch(err){ alert('No se pudo guardar la empresa: '+(err?.error||'error desconocido')); return; }
  }
  else if(S.modal==='add-casino'){
    const n=document.getElementById('mn').value.trim();if(!n)return;
    const ciudad=document.getElementById('mciudad').value.trim();
    const editId=S.mdata?.editId;
    try{
      if(editId){
        const updated=await api('PUT','/casinos/'+editId,{nombre:n,ciudad});
        const idx=S.data.casinos.findIndex(x=>x.id===editId);
        if(idx>-1)S.data.casinos[idx]={...updated,eId:updated.empresa_id};
        addLog('edit',`Casino editado: ${n}`);
      }else{
        const emp=S.data.empresas.find(e=>e.id===S.mdata.eId);
        const created=await api('POST','/casinos',{empresa_id:S.mdata.eId,nombre:n,ciudad});
        S.data.casinos.push({...created,eId:created.empresa_id});addLog('create',`Casino creado: ${n}`,`Empresa: ${emp?.nombre||'?'}`);
      }
    }catch(err){ alert('No se pudo guardar el casino: '+(err?.error||'error desconocido')); return; }
  }
  else if(S.modal==='new-usuario'){
    const u=document.getElementById('mu').value.trim(),pw=document.getElementById('mpw').value.trim(),rol=document.getElementById('mrol').value;
    const editId=S.mdata?.editId;
    if(!u)return;
    if(!editId&&!pw)return;
    let eId=null,cId=null,empresaIds=[];
    if(rolAsignacion(rol)==='single_casino'){
      eId=document.getElementById('memp').value?parseInt(document.getElementById('memp').value):null;
      cId=document.getElementById('mcas').value?parseInt(document.getElementById('mcas').value):null;
    }else{
      empresaIds=[...document.querySelectorAll('.memp-chk:checked')].map(el=>parseInt(el.value));
    }
    const body={usuario:u,rol,empresa_id:eId,casino_id:cId,empresa_ids:empresaIds};
    if(pw)body.password=pw;
    try{
      if(editId){
        const updated=await api('PUT','/usuarios/'+editId,body);
        const idx=S.data.usuarios.findIndex(x=>x.id===editId);
        if(idx>-1)S.data.usuarios[idx]={...updated,eId:updated.empresa_id,cId:updated.casino_id,empresaIds:updated.empresa_ids||[]};
        addLog('edit',`Usuario editado: ${u}`,`Rol: ${rol}`);
      }else{
        const created=await api('POST','/usuarios',body);
        S.data.usuarios.push({...created,eId:created.empresa_id,cId:created.casino_id,empresaIds:created.empresa_ids||[]});
        addLog('create',`Usuario creado: ${u}`,`Rol: ${rol}`);
      }
    }catch(err){ alert('No se pudo guardar el usuario: '+(err?.error||'error desconocido')); return; }
  }else if(S.modal==='edit-horario'){if(!await commitEdit())return}
  else if(S.modal==='rol-form'){
    const nombre=document.getElementById('mrnombre').value.trim();if(!nombre)return;
    const asignacion=document.getElementById('mrasig').value;
    const permisos={};
    document.querySelectorAll('.perm-chk').forEach(el=>{
      const mod=el.dataset.mod,accion=el.dataset.accion;
      if(!permisos[mod])permisos[mod]={};
      permisos[mod][accion]=el.checked;
    });
    const editId=S.mdata?.editId;
    try{
      if(editId){
        const updated=await api('PUT','/roles/'+editId,{nombre,asignacion,permisos});
        const idx=S.data.roles.findIndex(x=>x.id===editId);
        if(idx>-1)S.data.roles[idx]=updated;
        addLog('edit',`Rol editado: ${updated.nombre}`);
        if(S.user.rol===updated.nombre){S.user.permisos=updated.permisos;S.user.asignacion=updated.asignacion}
      }else{
        const created=await api('POST','/roles',{nombre,asignacion,permisos});
        S.data.roles.push(created);
        addLog('create',`Rol creado: ${created.nombre}`);
      }
    }catch(err){ alert('No se pudo guardar el rol: '+(err?.error||'error desconocido')); return; }
  }
  S.modal=null;S.mdata={};render();
}
window.addEventListener('hashchange',()=>render());
render();
</script>
